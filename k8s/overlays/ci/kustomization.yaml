apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI overlay — no Ollama available in the kind cluster.
#
# Patches applied:
#   1. ConfigMap: RETRIEVER=stub, LLM_PROVIDER=stub, RELEVANCE_FLOOR=1.1
#      (floor > stub passage scores 0.91/0.84/0.77 → API abstains for every question,
#      which is the correct behaviour when no real corpus is indexed)
#   2. indexer Job: runs --dummy (fake vectors, no Ollama needed, completes in <5s)
#
# /readyz skips the Chroma collection check when RETRIEVER=stub (see
# api/app/services/readiness.py), so the API rolls out as soon as Redis is ready.

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
      data:
        RETRIEVER: "stub"
        LLM_PROVIDER: "stub"
        RELEVANCE_FLOOR: "1.1"
    target:
      kind: ConfigMap
      name: rahbar-config

  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: indexer
      spec:
        template:
          spec:
            containers:
              - name: indexer
                args: ["python", "-m", "pipeline.run", "--dummy"]
    target:
      kind: Job
      name: indexer

