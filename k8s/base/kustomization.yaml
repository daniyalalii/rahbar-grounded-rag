apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - namespace.yaml
  - configmap.yaml
  - chroma.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - ingress.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
  - networkpolicy.yaml
  - hpa.yaml

configMapGenerator:
  - name: corpus
    files:
      - corpus/academic-rules-2023.md
      - corpus/academic-rules-2026.md
      - corpus/fees-2026.md

generatorOptions:
  disableNameSuffixHash: true
