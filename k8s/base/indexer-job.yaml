apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: indexer
    spec:
      enableServiceLinks: false
      serviceAccountName: indexer
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "pipeline.run", "--dummy"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

