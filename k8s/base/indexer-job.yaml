apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: indexer
    spec:
      enableServiceLinks: false
      serviceAccountName: indexer
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "pipeline.run"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: QUARANTINE_DIR
              value: /datalake/quarantine
            - name: ARCHIVE_DIR
              value: /datalake/archive
            - name: REPORT_DIR
              value: /datalake/reports
            - name: DATALAKE_DIR
              value: /datalake
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: datalake
              mountPath: /datalake
      volumes:
        - name: tmp
          emptyDir: {}
        - name: corpus
          configMap:
            name: corpus
        - name: datalake
          persistentVolumeClaim:
            claimName: datalake-pvc
