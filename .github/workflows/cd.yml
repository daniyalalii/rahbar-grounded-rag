name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt pytest-cov

      - name: Run api tests with coverage >= 60%
        env:
          RETRIEVER: stub
          LLM_PROVIDER: stub
        run: |
          (cd api && pytest --cov=app --cov-fail-under=60)

      - name: Run indexer tests
        run: |
          (cd indexer && pytest)

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: rahbar

      - name: Set prod overlay images with commit SHA
        run: |
          cd k8s/overlays/prod
          kustomize edit set image rahbar-api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          kustomize edit set image rahbar-indexer=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          kustomize edit set image rahbar-ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          cd ../../..

      - name: Apply prod overlay
        run: |
          kubectl apply -k k8s/overlays/prod


